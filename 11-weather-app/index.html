<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1 viewport-fit=cover">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Main container: centers the weather card vertically and horizontally -->
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <!-- Weather card: title, input and search button -->
    <div class="weather-card text-center p-4">
      <h2 class="mb-3">🌤️ Weather App</h2>

      <div class="input-group mb-3">
        <input type="text" id="cityInput" class="form-control" placeholder="Enter city name">
        <button class="btn btn-dark" id="getWeatherBtn">Search</button>
      </div>
      <!-- Weather result (hidden initially) -->
      <div id="weatherResult" class="mt-4 hidden">
        <h3 id="cityName"></h3>
        <h1 id="temperature"></h1>
        <p id="description"></p>
        <!-- Additional weather details -->
        <div class="details">
          <p>💧 Humidity: <span id="humidity"></span>%</p>
          <p>🌬️ Wind: <span id="windSpeed"></span> km/h</p>
        </div>
      </div>
      <!-- Error message -->
      <p id="errorMsg" class="text-danger mt-3"></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
